[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitstats-cli"
version = "1.0.0"
description = "Summarize a git repository's commit history: authors, day-of-week activity, and hot files."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["git", "stats", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/sidcore-dev/gitstats-cli"
Repository = "https://github.com/sidcore-dev/gitstats-cli"
Issues = "https://github.com/sidcore-dev/gitstats-cli/issues"

[project.scripts]
gitstats-cli = "gitstats_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
